# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  push:
    branches:
      - main

jobs:
  maven:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        cache: 'maven'
    - name: Check Java version
      run: java -version
    - name: Build with Maven
      run: ./mvnw package
    - name: Upload artifact for Docker job
      uses: actions/upload-artifact@v7
      with:
        name: java-app
        path: ${{ github.workspace }}/target/*.jar
        
  docker_publish:
    runs-on: ubuntu_latest
    needs: maven
    permissions: 
      contents: read
      packages: write
    
    steps:
    - uses: actions/checkout@v7
    - name: Download artifact from Maven job
      uses: actions/download-artifact@v8
      with:
        name: java-app
    - name: Logging in to Docker
      run: docker login ghcr.io -u madhh -p ${{ github.token }}
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ghcr.io/madhh/cubix/cloudnative/demo:actions
    - name: Publish Docker image
      run: docker push ghcr.io/USERNAME/cubix/cloudnative/demo:actions

  docker_verify:
    runs-on: ubuntu-latest
    needs: docker_publish
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v7
    - name: Download artifact from Docker Publish job
      uses: actions/download-artifact@v8
      with:
        name: java.app
    - name: Verify Docker image
      run: ./verify-image.sh
